name: Build animated character FBX

on:
  push:
    branches:
      - "**"
    paths:
      - "BOY VHARACTER.fbx"
      - "tools/add_lego_animations.py"
      - ".github/workflows/build-animated-fbx.yml"
    paths-ignore:
      - "BOY VHARACTER ANIMATED.fbx"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender

      - name: Build animated FBX
        run: |
          mkdir -p build
          blender -b --python tools/add_lego_animations.py --             --input "BOY VHARACTER.fbx"             --output "BOY VHARACTER ANIMATED.fbx"

      - name: Verify output
        run: |
          test -s "BOY VHARACTER ANIMATED.fbx"
          stat -c "%n %s bytes" "BOY VHARACTER.fbx" "BOY VHARACTER ANIMATED.fbx"

      - name: Commit animated FBX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "BOY VHARACTER ANIMATED.fbx"
          if git diff --cached --quiet; then
            echo "No generated-file changes."
            exit 0
          fi
          git commit -m "Add animated LEGO-style character FBX"
          git push
